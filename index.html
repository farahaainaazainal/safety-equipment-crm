<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Equipment CRM</title>
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React so the browser can understand it -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Load Babel to translate JSX code on the fly -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
    <!-- This is where our React app will appear -->
    <div id="root"></div>

    <!-- The actual CRM Code -->
    <script type="text/babel">
        const { useState } = React;

        // Simple SVG Icons
        const SearchIcon = () => <svg className="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>;
        const PlusIcon = () => <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>;
        const EditIcon = () => <svg className="w-4 h-4 text-blue-500 cursor-pointer hover:text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>;

        function SafetyCRM() {
            const [activeTab, setActiveTab] = useState('acquisition');
            const [searchQuery, setSearchQuery] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            
            // Initial Mock Data
            const [clients, setClients] = useState([
                { id: 1, name: "Petronas Offshore", type: "Enterprise", industry: "Oil & Gas", region: "Johor", status: "servicing", volume: "High", prices: { coveralls: 120, jackets: 180, gloves: 25 } },
                { id: 2, name: "Gamuda Construction", type: "Mid-Market", industry: "Construction", region: "Kuala Lumpur", status: "acquisition", volume: "Medium", prices: { coveralls: 95, jackets: 150, gloves: 18 } },
                { id: 3, name: "Sime Darby Plantation", type: "Enterprise", industry: "Agriculture", region: "Selangor", status: "servicing", volume: "High", prices: { coveralls: 85, jackets: 130, gloves: 15 } }
            ]);

            const [newClient, setNewClient] = useState({
                name: '', type: 'Mid-Market', industry: '', region: '', status: 'acquisition', volume: 'Low', prices: { coveralls: 0, jackets: 0, gloves: 0 }
            });

            const handleAddClient = (e) => {
                e.preventDefault();
                setClients([...clients, { ...newClient, id: Date.now() }]);
                setIsModalOpen(false);
            };

            const filteredClients = clients.filter(client => 
                client.status === activeTab &&
                client.name.toLowerCase().includes(searchQuery.toLowerCase())
            );

            return (
                <div className="max-w-6xl mx-auto bg-white rounded-lg shadow-lg overflow-hidden">
                    {/* Header */}
                    <div className="p-6 border-b border-gray-200 bg-blue-900 text-white flex justify-between items-center">
                        <div>
                            <h1 className="text-2xl font-bold">Safety Equipment CRM</h1>
                            <p className="text-blue-200 text-sm">Coveralls, Jackets & Safety Gear Pipeline</p>
                        </div>
                        <button 
                            onClick={() => setIsModalOpen(true)}
                            className="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded flex items-center font-semibold transition"
                        >
                            <PlusIcon /> New Client
                        </button>
                    </div>

                    {/* Navigation Tabs */}
                    <div className="flex border-b border-gray-200">
                        <button 
                            className={`flex-1 py-3 text-center font-medium ${activeTab === 'acquisition' ? 'border-b-2 border-blue-600 text-blue-600 bg-blue-50' : 'text-gray-500 hover:bg-gray-50'}`}
                            onClick={() => setActiveTab('acquisition')}
                        >
                            Client Acquisition (Prospects)
                        </button>
                        <button 
                            className={`flex-1 py-3 text-center font-medium ${activeTab === 'servicing' ? 'border-b-2 border-blue-600 text-blue-600 bg-blue-50' : 'text-gray-500 hover:bg-gray-50'}`}
                            onClick={() => setActiveTab('servicing')}
                        >
                            Client Servicing (Active Accounts)
                        </button>
                    </div>

                    {/* Toolbar */}
                    <div className="p-4 bg-gray-50 flex justify-between items-center border-b border-gray-200">
                        <div className="relative w-64">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <SearchIcon />
                            </div>
                            <input 
                                type="text" 
                                placeholder="Search clients..." 
                                className="pl-10 pr-4 py-2 w-full border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                            />
                        </div>
                    </div>

                    {/* Data Table */}
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-gray-100 text-gray-700 text-sm">
                                    <th className="p-4 border-b font-semibold">Client Details</th>
                                    <th className="p-4 border-b font-semibold">Industry & Region</th>
                                    <th className="p-4 border-b font-semibold">Volume</th>
                                    <th className="p-4 border-b font-semibold bg-blue-50">Dedicated Pricing (MYR)</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filteredClients.map(client => (
                                    <tr key={client.id} className="border-b hover:bg-gray-50 transition group">
                                        <td className="p-4">
                                            <div className="font-bold text-gray-800">{client.name}</div>
                                            <div className="text-xs text-gray-500">{client.type}</div>
                                        </td>
                                        <td className="p-4">
                                            <div className="text-sm font-medium">{client.industry}</div>
                                            <div className="text-xs text-gray-500">{client.region}</div>
                                        </td>
                                        <td className="p-4 text-sm font-medium text-gray-700">
                                            {client.volume}
                                        </td>
                                        <td className="p-4 text-sm bg-blue-50/30 relative">
                                            <div className="flex justify-between items-center group-hover:pr-6">
                                                <div>
                                                    <div>Coveralls: <span className="font-bold">RM {client.prices.coveralls}</span></div>
                                                    <div>Jackets: <span className="font-bold">RM {client.prices.jackets}</span></div>
                                                    <div>Gloves: <span className="font-bold">RM {client.prices.gloves}</span></div>
                                                </div>
                                                <div className="hidden group-hover:block absolute right-4" title="Edit Pricing">
                                                    <EditIcon />
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                                {filteredClients.length === 0 && (
                                    <tr>
                                        <td colSpan="4" className="p-8 text-center text-gray-500">
                                            No clients found in this category.
                                        </td>
                                    </tr>
                                )}
                            </tbody>
                        </table>
                    </div>

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-lg shadow-xl w-full max-w-md">
                                <div className="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-lg">
                                    <h2 className="font-bold text-lg">Add New Client</h2>
                                    <button onClick={() => setIsModalOpen(false)} className="text-gray-500 hover:text-red-500 font-bold">X</button>
                                </div>
                                <form onSubmit={handleAddClient} className="p-4 space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Company Name</label>
                                        <input required type="text" className="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" 
                                            onChange={e => setNewClient({...newClient, name: e.target.value})} />
                                    </div>
                                    <div className="flex space-x-4">
                                        <div className="flex-1">
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Industry</label>
                                            <input required type="text" className="w-full border p-2 rounded outline-none" 
                                                onChange={e => setNewClient({...newClient, industry: e.target.value})} />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Region</label>
                                            <input required type="text" className="w-full border p-2 rounded outline-none" 
                                                onChange={e => setNewClient({...newClient, region: e.target.value})} />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Status Pipeline</label>
                                        <select className="w-full border p-2 rounded outline-none" 
                                            onChange={e => setNewClient({...newClient, status: e.target.value})}>
                                            <option value="acquisition">Acquisition (Prospect)</option>
                                            <option value="servicing">Servicing (Active)</option>
                                        </select>
                                    </div>
                                    <div className="border-t pt-4">
                                        <label className="block text-sm font-bold text-gray-700 mb-2">Dedicated MYR Pricing</label>
                                        <div className="flex space-x-2">
                                            <div className="flex-1">
                                                <span className="text-xs text-gray-500">Coveralls</span>
                                                <input type="number" className="w-full border p-2 rounded outline-none" placeholder="RM" 
                                                    onChange={e => setNewClient({...newClient, prices: {...newClient.prices, coveralls: e.target.value}})} />
                                            </div>
                                            <div className="flex-1">
                                                <span className="text-xs text-gray-500">Jackets</span>
                                                <input type="number" className="w-full border p-2 rounded outline-none" placeholder="RM" 
                                                    onChange={e => setNewClient({...newClient, prices: {...newClient.prices, jackets: e.target.value}})} />
                                            </div>
                                            <div className="flex-1">
                                                <span className="text-xs text-gray-500">Gloves</span>
                                                <input type="number" className="w-full border p-2 rounded outline-none" placeholder="RM" 
                                                    onChange={e => setNewClient({...newClient, prices: {...newClient.prices, gloves: e.target.value}})} />
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">Save Client</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SafetyCRM />);
    </script>
</body>
</html>
