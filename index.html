<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Equipment CRM</title>
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React so the browser can understand it -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Load Babel to translate JSX code on the fly -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
    <!-- This is where our React app will appear -->
    <div id="root"></div>

    <!-- The actual CRM Code -->
    <script type="text/babel">
        const { useState } = React;

        // Simple SVG Icons
        const SearchIcon = () => <svg className="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>;
        const PlusIcon = () => <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>;
        const EditIcon = () => <svg className="w-5 h-5 text-blue-500 cursor-pointer hover:text-blue-700 bg-white rounded-full p-0.5 shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>;

        function SafetyCRM() {
            const [activeTab, setActiveTab] = useState('acquisition');
            const [searchQuery, setSearchQuery] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            
            // Edit State
            const [editingClientId, setEditingClientId] = useState(null);
            const [editPrices, setEditPrices] = useState({ coveralls: 0, jackets: 0, gloves: 0 });
            
            // Initial Mock Data
            const [clients, setClients] = useState([
                { id: 1, name: "Petronas Offshore", type: "Enterprise", industry: "Oil & Gas", region: "Johor", status: "servicing", volume: "High", prices: { coveralls: 120, jackets: 180, gloves: 25 } },
                { id: 2, name: "Gamuda Construction", type: "Mid-Market", industry: "Construction", region: "Kuala Lumpur", status: "acquisition", volume: "Medium", prices: { coveralls: 95, jackets: 150, gloves: 18 } },
                { id: 3, name: "Sime Darby Plantation", type: "Enterprise", industry: "Agriculture", region: "Selangor", status: "servicing", volume: "High", prices: { coveralls: 85, jackets: 130, gloves: 15 } }
            ]);

            const [newClient, setNewClient] = useState({
                name: '', type: 'Mid-Market', industry: '', region: '', status: 'acquisition', volume: 'Low', prices: { coveralls: 0, jackets: 0, gloves: 0 }
            });

            // Handle Saving a New Client
            const handleAddClient = (e) => {
                e.preventDefault();
                setClients([...clients, { ...newClient, id: Date.now() }]);
                setIsModalOpen(false);
                // Reset form
                setNewClient({name: '', type: 'Mid-Market', industry: '', region: '', status: 'acquisition', volume: 'Low', prices: { coveralls: 0, jackets: 0, gloves: 0 }});
            };

            // Handle Starting the Edit Process
            const startEditing = (client) => {
                setEditingClientId(client.id);
                setEditPrices({ ...client.prices });
            };

            // Handle Saving the Edited Prices
            const saveEditing = (id) => {
                setClients(clients.map(c => c.id === id ? { ...c, prices: editPrices } : c));
                setEditingClientId(null);
            };

            const filteredClients = clients.filter(client => 
                client.status === activeTab &&
                client.name.toLowerCase().includes(searchQuery.toLowerCase())
            );

            return (
                <div className="max-w-6xl mx-auto bg-white rounded-lg shadow-lg overflow-hidden">
                    {/* Header */}
                    <div className="p-6 border-b border-gray-200 bg-blue-900 text-white flex justify-between items-center">
                        <div>
                            <h1 className="text-2xl font-bold">Safety Equipment CRM</h1>
                            <p className="text-blue-200 text-sm">Coveralls, Jackets & Safety Gear Pipeline</p>
                        </div>
                        <button 
                            onClick={() => setIsModalOpen(true)}
                            className="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded flex items-center font-semibold transition shadow-md"
                        >
                            <PlusIcon /> New Client
                        </button>
                    </div>

                    {/* Navigation Tabs */}
                    <div className="flex border-b border-gray-200">
                        <button 
                            className={`flex-1 py-3 text-center font-medium ${activeTab === 'acquisition' ? 'border-b-2 border-blue-600 text-blue-600 bg-blue-50' : 'text-gray-500 hover:bg-gray-50'}`}
                            onClick={() => setActiveTab('acquisition')}
                        >
                            Client Acquisition (Prospects)
                        </button>
                        <button 
                            className={`flex-1 py-3 text-center font-medium ${activeTab === 'servicing' ? 'border-b-2 border-blue-600 text-blue-600 bg-blue-50' : 'text-gray-500 hover:bg-gray-50'}`}
                            onClick={() => setActiveTab('servicing')}
                        >
                            Client Servicing (Active Accounts)
                        </button>
                    </div>

                    {/* Toolbar */}
                    <div className="p-4 bg-gray-50 flex justify-between items-center border-b border-gray-200">
                        <div className="relative w-72">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <SearchIcon />
                            </div>
                            <input 
                                type="text" 
                                placeholder="Search clients..." 
                                className="pl-10 pr-4 py-2 w-full border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                            />
                        </div>
                    </div>

                    {/* Data Table */}
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-gray-100 text-gray-700 text-sm">
                                    <th className="p-4 border-b font-semibold">Client Details</th>
                                    <th className="p-4 border-b font-semibold">Industry & Region</th>
                                    <th className="p-4 border-b font-semibold">Volume</th>
                                    <th className="p-4 border-b font-semibold bg-blue-50 w-64">Dedicated Pricing (MYR)</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filteredClients.map(client => (
                                    <tr key={client.id} className="border-b hover:bg-gray-50 transition group">
                                        <td className="p-4">
                                            <div className="font-bold text-gray-800">{client.name}</div>
                                            <div className="text-xs text-gray-500 inline-block bg-gray-200 rounded px-2 py-0.5 mt-1">{client.type}</div>
                                        </td>
                                        <td className="p-4">
                                            <div className="text-sm font-medium">{client.industry}</div>
                                            <div className="text-xs text-gray-500 flex items-center mt-1">
                                                <svg className="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clipRule="evenodd"></path></svg>
                                                {client.region}
                                            </div>
                                        </td>
                                        <td className="p-4 text-sm font-medium text-gray-700">
                                            <span className={`px-2 py-1 rounded text-xs font-bold ${
                                                client.volume === 'High' ? 'bg-green-100 text-green-700' : 
                                                client.volume === 'Medium' ? 'bg-yellow-100 text-yellow-700' : 
                                                'bg-gray-100 text-gray-700'
                                            }`}>
                                                {client.volume}
                                            </span>
                                        </td>
                                        <td className="p-4 text-sm bg-blue-50/30">
                                            {editingClientId === client.id ? (
                                                <div className="bg-white p-2 rounded border border-blue-200 shadow-sm animate-fade-in">
                                                    <div className="space-y-2">
                                                        <div className="flex items-center justify-between text-xs">
                                                            <span className="text-gray-600">Coveralls (RM):</span>
                                                            <input type="number" className="w-20 border rounded p-1 focus:ring-1 focus:ring-blue-500 outline-none" value={editPrices.coveralls} onChange={e => setEditPrices({...editPrices, coveralls: e.target.value})} />
                                                        </div>
                                                        <div className="flex items-center justify-between text-xs">
                                                            <span className="text-gray-600">Jackets (RM):</span>
                                                            <input type="number" className="w-20 border rounded p-1 focus:ring-1 focus:ring-blue-500 outline-none" value={editPrices.jackets} onChange={e => setEditPrices({...editPrices, jackets: e.target.value})} />
                                                        </div>
                                                        <div className="flex items-center justify-between text-xs">
                                                            <span className="text-gray-600">Gloves (RM):</span>
                                                            <input type="number" className="w-20 border rounded p-1 focus:ring-1 focus:ring-blue-500 outline-none" value={editPrices.gloves} onChange={e => setEditPrices({...editPrices, gloves: e.target.value})} />
                                                        </div>
                                                    </div>
                                                    <div className="flex space-x-2 mt-3 pt-2 border-t">
                                                        <button onClick={() => saveEditing(client.id)} className="flex-1 bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-1 rounded transition">Save</button>
                                                        <button onClick={() => setEditingClientId(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold py-1 rounded transition">Cancel</button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="flex justify-between items-center relative">
                                                    <div className="space-y-1">
                                                        <div className="flex justify-between w-32"><span className="text-gray-500">Coveralls:</span> <span className="font-bold">RM {client.prices.coveralls}</span></div>
                                                        <div className="flex justify-between w-32"><span className="text-gray-500">Jackets:</span> <span className="font-bold">RM {client.prices.jackets}</span></div>
                                                        <div className="flex justify-between w-32"><span className="text-gray-500">Gloves:</span> <span className="font-bold">RM {client.prices.gloves}</span></div>
                                                    </div>
                                                    <button 
                                                        onClick={() => startEditing(client)}
                                                        className="absolute right-0 opacity-0 group-hover:opacity-100 transition-opacity duration-200"
                                                        title="Edit Pricing"
                                                    >
                                                        <EditIcon />
                                                    </button>
                                                </div>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                                {filteredClients.length === 0 && (
                                    <tr>
                                        <td colSpan="4" className="p-8 text-center text-gray-500">
                                            No clients found matching "{searchQuery}"
                                        </td>
                                    </tr>
                                )}
                            </tbody>
                        </table>
                    </div>

                    {/* New Client Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-lg shadow-2xl w-full max-w-md overflow-hidden">
                                <div className="p-4 border-b flex justify-between items-center bg-blue-50">
                                    <h2 className="font-bold text-lg text-blue-900">Add New Client</h2>
                                    <button onClick={() => setIsModalOpen(false)} className="text-gray-500 hover:text-red-500 font-bold transition">✕</button>
                                </div>
                                <form onSubmit={handleAddClient} className="p-5 space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Company Name</label>
                                        <input required type="text" className="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" 
                                            value={newClient.name} onChange={e => setNewClient({...newClient, name: e.target.value})} />
                                    </div>
                                    <div className="flex space-x-4">
                                        <div className="flex-1">
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Industry</label>
                                            <input required type="text" className="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" 
                                                value={newClient.industry} onChange={e => setNewClient({...newClient, industry: e.target.value})} />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Region</label>
                                            <input required type="text" className="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" 
                                                value={newClient.region} onChange={e => setNewClient({...newClient, region: e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="flex space-x-4">
                                        <div className="flex-1">
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Status Pipeline</label>
                                            <select className="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" 
                                                value={newClient.status} onChange={e => setNewClient({...newClient, status: e.target.value})}>
                                                <option value="acquisition">Acquisition (Prospect)</option>
                                                <option value="servicing">Servicing (Active)</option>
                                            </select>
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Volume</label>
                                            <select className="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" 
                                                value={newClient.volume} onChange={e => setNewClient({...newClient, volume: e.target.value})}>
                                                <option value="Low">Low</option>
                                                <option value="Medium">Medium</option>
                                                <option value="High">High</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="border-t pt-4 mt-2">
                                        <label className="block text-sm font-bold text-gray-800 mb-3">Dedicated MYR Pricing</label>
                                        <div className="flex space-x-3">
                                            <div className="flex-1 relative">
                                                <span className="text-xs text-gray-500 block mb-1">Coveralls</span>
                                                <input type="number" className="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none pl-7" 
                                                    value={newClient.prices.coveralls || ''} onChange={e => setNewClient({...newClient, prices: {...newClient.prices, coveralls: e.target.value}})} />
                                                <span className="absolute left-2 bottom-2 text-gray-400 text-sm">RM</span>
                                            </div>
                                            <div className="flex-1 relative">
                                                <span className="text-xs text-gray-500 block mb-1">Jackets</span>
                                                <input type="number" className="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none pl-7" 
                                                    value={newClient.prices.jackets || ''} onChange={e => setNewClient({...newClient, prices: {...newClient.prices, jackets: e.target.value}})} />
                                                <span className="absolute left-2 bottom-2 text-gray-400 text-sm">RM</span>
                                            </div>
                                            <div className="flex-1 relative">
                                                <span className="text-xs text-gray-500 block mb-1">Gloves</span>
                                                <input type="number" className="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none pl-7" 
                                                    value={newClient.prices.gloves || ''} onChange={e => setNewClient({...newClient, prices: {...newClient.prices, gloves: e.target.value}})} />
                                                <span className="absolute left-2 bottom-2 text-gray-400 text-sm">RM</span>
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md mt-2">Save New Client</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SafetyCRM />);
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
    </style>
</body>
</html>
